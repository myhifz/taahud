# Réveille chaque jour le serveur Supabase de Ta'ahud (synchronisation des comptes).
# Sur l'offre gratuite, un projet sans activité pendant 7 jours est mis en pause.
# La fonction ping ne lit ni n'écrit aucune donnée ; la clé « publishable » est publique.
name: Réveil Supabase

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -fsS -X POST "https://upiilpqskqqoglimshcy.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_Dh8FOtPPRTx__Obs54Ro5Q_8Iv_XIbe" \
            -H "Content-Type: application/json" -d '{}'
